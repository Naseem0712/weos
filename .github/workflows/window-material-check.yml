name: Window material validation
on:
  push:
    branches: [verify/window-rulebook-materials]
permissions:
  contents: read
jobs:
  costing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m WEOS._smoke_rulebook_materials
      - run: python -m WEOS._smoke_casement_fix_door
      - run: python -m WEOS._smoke_live_al_seals
      - run: python -m WEOS._smoke_design_cost
