# Railway — deploy from GitHub via Dockerfile (more reliable than Nixpacks for Cairo/svglib)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must go through a shell so $PORT expands (Railway does not expand $PORT in bare startCommand).
startCommand = "/bin/sh /app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
