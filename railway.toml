# Railway — auto-deploy from GitHub (Nixpacks detects Python + requirements.txt)
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn WEOS.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
